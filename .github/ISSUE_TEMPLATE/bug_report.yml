name: Bug Report
description: Create a report to help us improve. Write in English, please.
title: "[BUG] Write a title for your bug"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for creating a bug report to help us improve!
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool were you using? For example "Compress Video".
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is. Include the message the tool showed, if any.
    validations:
      required: true
  - type: textarea
    id: bug-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior. For example, "1. Open 'Split PDF', 2. Choose 'Page ranges', 3. Enter '...', 4. See error"
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: Windows Toolbox Version
      description: Shown under Settings → About.
    validations:
      required: false
  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: For example "Windows 11 24H2". Run `winver` if you're not sure.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before opening this Issue
      options:
        - label: I have searched the issues of this repository and believe that this is not a duplicate.
          required: true
        - label: I have not attached any file that contains private information.
          required: true
