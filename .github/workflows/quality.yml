name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache verified engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}\engines
          key: engines-${{ hashFiles('src/Pocketknife.Core/Engines/EngineSpec.cs') }}
      - run: dotnet restore Pocketknife.slnx
      - name: Check formatting
        run: dotnet format Pocketknife.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Pocketknife.slnx -c Release --no-restore
      - name: Run tests
        env:
          POCKETKNIFE_TEST_ENGINES: ${{ runner.temp }}\engines
        run: dotnet test --project tests/Pocketknife.Tests -c Release --no-build
      - name: Build portable zip and installer
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pocketknife-${{ github.sha }}
          path: release/
          retention-days: 14
